[package]
name = "wallset-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wallpaper surface acquisition: the desktop host window for video, and per-monitor static wallpaper."

[dependencies]
wallset-core = { workspace = true }
thiserror = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi"] }
