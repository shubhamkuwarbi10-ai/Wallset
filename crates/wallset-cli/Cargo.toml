[package]
name = "wallset-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line front end and diagnostics for wallSet."

[[bin]]
name = "wallset"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
wallset-core = { workspace = true }
wallset-display = { workspace = true }
wallset-media = { workspace = true }
wallset-surface = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
