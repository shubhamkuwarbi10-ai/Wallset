[package]
name = "wallset-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Resident wallSet process: owns config, display topology and the resource policy. Never decodes, never renders, never polls."

[dependencies]
wallset-core = { workspace = true }
wallset-display = { workspace = true }
wallset-surface = { workspace = true }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemServices"] }
