[package]
name = "wallset-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "On-demand settings window for wallSet. Not resident: it exits when closed."

[dependencies]
wallset-core = { workspace = true }
wallset-display = { workspace = true }
wallset-media = { workspace = true }
wallset-surface = { workspace = true }
eframe = "0.33.3"
rfd = "0.17.2"
raw-window-handle = "0.6.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
